<div class="input-wrapper">
  <div class="input-header" *ngIf="label">
    <label class="input-label">
      {{ label }}
    </label>
    <ng-content select="[label-action]"></ng-content>
  </div>
  <div class="input-container">
    <div class="icon-left" *ngIf="hasIconLeft">
        <ng-content select="[icon-left]"></ng-content>
    </div>
    <input
      [type]="actualType"
      [placeholder]="placeholder"
      [disabled]="isDisabled"
      [value]="value"
      (input)="onInputChange($event)"
      (blur)="onTouched()"
      class="form-control generic-input"
      [class.has-icon-left]="hasIconLeft"
      [class.has-icon-right]="hasIconRight || type === 'password'"
    />
    <div class="icon-right" *ngIf="hasIconRight || type === 'password'">
         <ng-content select="[icon-right]"></ng-content>
         <button type="button" *ngIf="type === 'password' && !hasIconRight" (click)="togglePasswordVisibility()" class="password-toggle">
            <svg *ngIf="!passwordVisible" class="toggle-icon bg-transparent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="passwordVisible" class="toggle-icon bg-transparent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
         </button>
    </div>
  </div>
  <p *ngIf="error" class="input-error">{{ error }}</p>
</div>
