<div class="login-wrapper">
  <!-- Fondo abstracto -->
  <div class="login-bg-pattern d-none d-lg-block">
    <svg viewBox="0 0 1440 800" fill="none" preserveAspectRatio="xMidYMid slice">
      <path d="M0 400C250 200 450 600 720 400C990 200 1200 600 1440 400" stroke="#E5E7EB" stroke-width="1.5" />
      <path d="M0 500C300 300 500 700 820 500C1140 300 1300 600 1440 500" stroke="#E5E7EB" stroke-width="1" />
    </svg>
  </div>

  <div class="container login-content d-flex flex-column justify-content-between min-vh-100 py-4">
    

    <div></div>

    <!-- dos columnas -->
    <div class="row align-items-center justify-content-center w-100 m-0 flex-grow-1">
      
      <!-- Lado Izquierdo: Formulario -->
      <div class="col-12 col-lg-5 order-2 order-lg-1 d-flex flex-column align-items-center align-items-lg-end pr-lg-4">
        <div class="login-card w-100" style="max-width: 420px; margin: 0 auto;">
          <div class="login-title-section">
            <h2>Bienvenido de nuevo</h2>
            <p>Acceda a su ecosistema de citas seleccionado.</p>
          </div>

          <div class="alert alert-danger error-box" [class.d-none]="!errorMessage" style="margin-bottom: 1rem; padding: 0.5rem 1rem;">
            <span>{{ errorMessage }}</span>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
            
            <div class="form-group mb-3">
              <app-input
                label="Dirección de correo electrónico"
                type="email"
                placeholder="nombre@empresa.com"
                formControlName="email"
                [hasIconLeft]="true"
                [error]="(loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']) ? 'Email no válido' : (loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required'] ? 'El email es obligatorio' : null)"
              >
                <svg icon-left class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
              </app-input>
            </div>

            <div class="form-group mb-4">
              <app-input
                label="Contraseña"
                type="password"
                placeholder="••••••••"
                formControlName="password"
                [hasIconLeft]="true"
                [error]="(loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['minlength']) ? 'Mínimo 6 caracteres' : (loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required'] ? 'La contraseña es obligatoria' : null)"
              >
                <a label-action href="#" class="forgot-link">¿OLVIDÓ SU CONTRASEÑA?</a>
                <svg icon-left class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
              </app-input>
            </div>

            <div class="remember-group">
              <input id="remember" type="checkbox" class="form-check-input remember-checkbox">
              <label for="remember" class="remember-label">Mantener sesión iniciada</label>
            </div>

            <app-button
              type="submit"
              variant="primary"
              customClass="w-100 py-2 btn-login block"
              class="d-block w-100"
              [disabled]="isLoading"
            >
              <div class="btn-content">
                <span *ngIf="!isLoading">Iniciar sesión en el Panel</span>
                <svg *ngIf="!isLoading" class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                <div *ngIf="isLoading" class="spinner-border spinner-border-sm text-light" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
            </app-button>

            <div class="auth-divider">
              <span>Authorized Access</span>
            </div>
            
            <p class="register-text">
              ¿No tiene una cuenta? <a href="#" class="register-link font-bold">Regístrese aquí</a>
            </p>

          </form>
        </div>
      </div>

      <!-- Lado Derecho: Logo -->
      <div class="col-12 col-lg-7 order-1 order-lg-2 text-center text-lg-center pl-lg-5 mb-5 mb-lg-0">
        <app-logo [size]="800" customClass="mx-auto"></app-logo>
      </div>

    </div>

    <!-- Footer -->
    <div class="w-100 text-center mt-4">
      <app-footer></app-footer>
    </div>

  </div>

</div>
